name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run test suite
        run: bun test

      - name: Build library
        run: bun run build

      - name: Setup Node for npm publication
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 npm >= 11.5.1。node 20 自带 npm 10.x，
          # 会直接走 token 认证路径 → ENEEDAUTH（2026-10-17 v1.0.1 那次失败即此）。
          # 与 ai-orb / im-notify-kit 两条已跑通的发布链路对齐到 24。
          node-version: '24'
          # ⚠️ 不要设 registry-url：setup-node 一旦带它，就会自动往环境里注入
          # NODE_AUTH_TOKEN（取不到 secret 时是一个空/占位值，日志里显示为掩码）。
          # npm CLI 看到这个变量存在就直接走 token 认证，不再换 OIDC 凭据，
          # Trusted Publishing 形同未配 —— 2026-11-04 v1.1.0 的 E404 即此。
          # 2026-10-17 那次的注释把它归因于「NODE_AUTH_TOKEN 为空」，但真源是
          # registry-url 触发的自动注入；去掉 registry-url 后变量根本不会出现。

      # 不能再显式设 NODE_AUTH_TOKEN（哪怕是空字符串）：npm 只看「变量是否存在」，
      # 存在即走 token 认证 → ENEEDAUTH。删掉 registry-url 后该变量不再被注入，
      # npm 11.5.1+ 会自动对 registry.npmjs.org 做 OIDC 交换。
      - name: Publish to npm (Provenance & Trusted Publishing)
        run: |
          echo "npm $(npm --version) / node $(node --version)"
          env | grep -c '^NODE_AUTH_TOKEN=' || true
          npm publish --access public --provenance
