name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run test suite
        run: bun test

      - name: Build library
        run: bun run build

      - name: Setup Node for npm publication
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 npm >= 11.5.1。node 20 自带 npm 10.x，
          # 会直接走 token 认证路径 → ENEEDAUTH（2026-10-17 v1.0.1 那次失败即此）。
          # 与 ai-orb / im-notify-kit 两条已跑通的发布链路对齐到 24。
          node-version: '24'
          # registry-url 要留着：它让 setup-node 写出 registry 指向，npm 才会
          # 对 registry.npmjs.org 走 OIDC 交换。2026-11-04 曾把它去掉，反而变成
          # ENEEDAUTH（npm 连 OIDC 都没尝试）。
          registry-url: 'https://registry.npmjs.org'
          # 发版构建不要开缓存：缓存里的 dist 可能是旧产物。
          package-manager-cache: false

      # 不能设 NODE_AUTH_TOKEN（哪怕是空字符串）：npm 只看「变量是否存在」，
      # 存在即走 token 认证、不再换 OIDC 凭据。setup-node 在没有对应 secret 时
      # 注入的是空值，所以这里必须让它彻底不存在 —— 纯 OIDC 即可，无需任何 secret。
      - name: Publish to npm (Provenance & Trusted Publishing)
        run: |
          echo "npm $(npm --version) / node $(node --version)"
          npm publish --access public --provenance
